{# The update button for admins (docs/updates.md); static/iam/updates.js runs it. Icons: Lucide. #}
<div class="updates" data-updates data-app="Meldgrove IAM" data-csrf="{{ csrf_token }}"
     data-status-url="{% url 'updates' %}" data-check-url="{% url 'updates_check' %}" data-install-url="{% url 'updates_install' %}">
  <button type="button" class="icon-button updates-button" data-state="idle" aria-label="Check for updates" aria-haspopup="dialog" aria-expanded="false" aria-controls="updates-popover">
    <svg class="icon icon-refresh" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    <svg class="icon icon-download" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    <svg class="icon icon-alert" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <svg class="icon icon-loader" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <span class="updates-dot" aria-hidden="true"></span>
  </button>
  <span class="updates-tooltip" role="tooltip" aria-hidden="true">Check for updates</span>
  <div class="updates-popover" id="updates-popover" role="dialog" aria-label="Updates" hidden></div>
</div>
<dialog class="updates-confirm" aria-labelledby="updates-confirm-title">
  <form method="dialog">
    <h2 class="updates-confirm-title" id="updates-confirm-title"></h2>
    <p class="updates-confirm-text"></p>
    <p class="updates-confirm-notes" hidden></p>
    <div class="form-actions">
      <button class="btn" type="submit" value="cancel">Cancel</button>
      <button class="btn primary updates-confirm-ok" type="submit" value="install">Install</button>
    </div>
  </form>
</dialog>
<div class="updates-toast" role="status" aria-live="polite" hidden></div>
