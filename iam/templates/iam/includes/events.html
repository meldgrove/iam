{% load iam_tags %}
{% if events %}
<table>
  <thead><tr><th>When</th><th>Who</th><th>What</th></tr></thead>
  <tbody>
  {% for e in events %}
    <tr><td class="small muted">{{ e.created_at|date:"d.m.Y H:i" }}</td><td class="small">{{ e.actor_label }}</td><td>{{ e.summary }}{% if show_person and e.person %} · <a href="{% url 'person_detail' e.person.pk %}">{{ e.person }}</a>{% endif %}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% else %}<p class="empty">Nothing yet.</p>{% endif %}
