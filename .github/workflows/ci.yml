name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"

jobs:
  checks:
    # The ruleset of main requires this check by name: rename both together.
    name: Checks, tests and production image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iam
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: iam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam" --health-interval 5s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check public repository contents
        run: node scripts/check-public-repository.mjs

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "The schema in apps/server/src/db/schema.ts has changes without a migration. Run: npm run db:generate"
            exit 1
          fi

      - name: Integration tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://iam:iam@localhost:5432/iam_test
        run: npm run test:integration

      - run: npm run build
      # What the image installs (Dockerfile, prod-deps).
      - run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Build production image
        run: docker build --tag iam:ci .

      - name: The image runs as the user of the Django version
        run: test "$(docker run --rm --entrypoint id iam:ci -u)" = "10001"

      # Production settings: the image refuses to start without its secrets,
      # migrates an empty database, and serves the sign-in page.
      - name: Start the production image
        run: |
          docker run --rm --network host iam:ci migrate 2>&1 | grep -q "Invalid configuration" \
            || { echo "The image started without its settings"; exit 1; }
          env_args=(
            -e DATABASE_URL=postgresql://iam:iam@localhost:5432/iam
            -e APP_URL=https://iam.example.invalid
            -e AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only-secret
            -e ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url')+'=')")
            -e OIDC_ISSUER=https://sso.example.invalid/realms/iam -e OIDC_CLIENT_ID=iam -e OIDC_CLIENT_SECRET=ci
            -e HEALTHCHECK_TOKEN=ci-token
          )
          docker run --rm --network host "${env_args[@]}" iam:ci migrate
          docker run -d --name web --network host "${env_args[@]}" iam:ci web
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/-/healthz && break; sleep 1; done
          curl -fsS -H "accept: text/html" http://localhost:8000/login | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/me)" = "401"
          docker run --rm --network host "${env_args[@]}" iam:ci cli generate-key | grep -Eq '^[A-Za-z0-9_-]{43}=$'

      # The updater installs images, not files: a server of 0.2 starts the
      # image with the Django compose.yaml.
      - name: Upgrade from 0.2 with its compose file, and back
        run: tests/upgrade/django-compose.sh iam:ci

      - name: Show logs on failure
        if: failure()
        run: docker logs web || true

  end-to-end:
    # The ruleset of main requires this check by name: rename both together.
    name: End-to-end with Keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start PostgreSQL, Keycloak and Mailpit
        run: docker compose -f compose.dev.yaml up --detach --wait

      - name: Build production image
        run: docker build --tag iam:ci .

      - name: Start web and worker
        run: |
          env_args=(
            -e NODE_ENV=development
            -e DATABASE_URL=postgresql://iam:iam@localhost:55438/iam
            -e APP_URL=http://localhost:8000
            -e KEYCLOAK_URL=http://localhost:8098 -e KEYCLOAK_REALM=iam
            -e OIDC_CLIENT_ID=iam -e OIDC_CLIENT_SECRET=iam-dev-client-secret
            -e OIDC_ADMIN_GROUPS=/iam/admins -e WORKER_POLL_SECONDS=1
            -e UPDATER_URL=
          )
          docker run --rm --network host "${env_args[@]}" iam:ci migrate
          docker run -d --name web --network host "${env_args[@]}" iam:ci web
          docker run -d --name worker --network host "${env_args[@]}" iam:ci worker
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/-/healthz && break; sleep 1; done

      - name: Install Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the end-to-end check
        env:
          OUTPUT_DIR: ${{ runner.temp }}/browser
        run: node tests/browser/e2e.mjs

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-screenshots
          path: ${{ runner.temp }}/browser/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs web || true
          docker logs worker || true
          docker compose -f compose.dev.yaml logs --no-color keycloak | tail -100
