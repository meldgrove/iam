[project]
name = "iam"
# Releases take their version from the git tag (docs/releases.md).
version = "0.0.0"
description = "Self-hosted identity and access management: people, teams, access profiles, onboarding and offboarding across connected apps."
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography>=50.0.2,<51",
  "django>=6.1.3,<6.2",
  "dj-database-url>=3,<4",
  "google-auth>=2.40,<3",
  "gunicorn>=27.0.0,<28",
  "httpx>=0.28,<1",
  "mozilla-django-oidc>=5.0.2,<6",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "requests>=2.32,<3",
  "sentry-sdk>=2.40,<3",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"iam/migrations/*.py" = ["I001"]
