# Local development: PostgreSQL, a Keycloak with a ready realm, and Mailpit.
# The app runs on the host (docs/development.md):
#   docker compose -f compose.dev.yaml up -d
#   cp .env.example .env && uv run python manage.py migrate && uv run python manage.py runserver
# Keycloak: http://localhost:8098 (admin/admin; realm "iam", user admin@example.invalid / admin)
# Mailpit:  http://localhost:8027 (SMTP on 1027)
name: iam-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-55438}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iam"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-2
    command: ["start-dev", "--import-realm", "--http-port=8098"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The image sizes the heap from host RAM (up to 70 %); cap it for local use.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
      KC_HOSTNAME: http://localhost:8098
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:${DEV_SMTP_PORT:-1027}:1025"
      - "127.0.0.1:${DEV_MAILPIT_PORT:-8027}:8025"

volumes:
  postgres:
